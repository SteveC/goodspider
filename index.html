<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoodSpider, LLC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            color: #333;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }
        
        .container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.1);
            padding: 4rem 3rem;
            max-width: 650px;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            z-index: 1;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        .logo {
            max-width: 300px;
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto 3rem;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.08));
            transition: transform 0.3s ease;
        }
        
        .logo:hover {
            transform: scale(1.02);
        }
        
        h1 {
            font-size: 2.75rem;
            margin-bottom: 1rem;
            color: #1a202c;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }
        
        .subtitle {
            font-size: 1.125rem;
            color: #718096;
            margin-bottom: 3rem;
            font-weight: 400;
        }
        
        .section {
            text-align: center;
            margin-top: 2.5rem;
            padding-top: 2.5rem;
            border-top: 1px solid #e2e8f0;
        }
        
        h2 {
            font-size: 1.25rem;
            margin-bottom: 1.5rem;
            color: #4a5568;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.875rem;
        }
        
        .contact-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #667eea;
            text-decoration: none;
            font-size: 1.125rem;
            padding: 1rem 2rem;
            border: 2px solid #667eea;
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 0.5rem;
            font-weight: 500;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%);
            position: relative;
            overflow: hidden;
        }
        
        .contact-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: -1;
        }
        
        .contact-link:hover {
            color: white;
            border-color: #667eea;
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.35);
        }
        
        .contact-link:hover::before {
            left: 0;
        }
        
        .contact-link:active {
            transform: translateY(-1px);
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 3rem 2rem;
                border-radius: 20px;
            }
            
            h1 {
                font-size: 2.25rem;
            }
            
            .logo {
                max-width: 240px;
                margin-bottom: 2rem;
            }
            
            .contact-link {
                font-size: 1rem;
                padding: 0.875rem 1.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="image.jpg" alt="GoodSpider, LLC Logo" class="logo">
        <h1>Welcome to GoodSpider, LLC</h1>
        <div class="section">
            <h2>Contact</h2>
            <a href="mailto:hello@goodspider.net" class="contact-link">hello@goodspider.net</a>
        </div>
    </div>
</body>
</html>
